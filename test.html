<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ceres Drift — TPP Flight Console</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f2ede8;
      --muted: #b7b5c2;
      --accent: #ffa57b;
      --line: #e0e0ff32;
      --pad: clamp(22px, 4.3vw, 72px);
      --mono: "SFMono-Regular", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; height: 100dvh; overflow: hidden;
      background: #080912; color: var(--ink);
      font: 16px/1.4 system-ui, sans-serif;
    }
    #space, .shade { position: fixed; inset: 0; width: 100%; height: 100%; }
    #space { display: block; outline: none; touch-action: none; }
    #space.drag-mode { cursor: grab; }
    #space.dragging { cursor: grabbing; }
    .shade {
      pointer-events: none;
      background:
        linear-gradient(0deg, #080912ee 0%, #08091278 13%, transparent 40%),
        linear-gradient(180deg, #080912c2, transparent 19%),
        radial-gradient(ellipse at 58% 41%, transparent 45%, #08091265 100%);
    }
    header, footer {
      position: absolute; left: var(--pad); right: var(--pad);
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; pointer-events: none;
    }
    header { top: 24px; padding-bottom: 17px; border-bottom: 1px solid var(--line); }
    footer { bottom: 20px; padding-top: 15px; border-top: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: grid; place-items: center; width: 36px; height: 36px;
      color: var(--accent); border: 1px solid #ffa57b70;
      border-radius: 50%; font-size: 23px;
    }
    .brand strong { display: block; font-size: 15px; letter-spacing: .22em; }
    .mono { font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; }
    .brand small, .metrics small { display: block; color: var(--muted); }
    .status { display: flex; align-items: center; gap: 9px; color: var(--muted); }
    .status::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 12px #ffa57b95;
    }
    button { color: inherit; font: inherit; cursor: pointer; pointer-events: auto; }
    button:focus-visible { outline: 2px solid white; outline-offset: 5px; }
    #reset { padding: 9px 13px; background: #10101bcc; border: 1px solid var(--line); border-radius: 4px; }
    #reset:hover { border-color: var(--accent); }
    #reset span { margin-left: 6px; }
    .briefing {
      position: absolute; left: var(--pad); bottom: clamp(120px, 20vh, 200px);
      max-width: calc(100% - var(--pad) * 2); pointer-events: none;
    }
    .sector { display: flex; align-items: center; gap: 10px; color: var(--accent); }
    .sector::before { content: ""; width: 23px; height: 1px; background: currentColor; }
    h1 {
      margin: 9px 0 15px; font-size: clamp(52px, 8vw, 120px);
      line-height: .98; font-weight: 650; letter-spacing: -.078em;
    }
    .briefing p { margin: 0 0 23px; color: var(--muted); }
    #launch {
      display: inline-flex; align-items: center; justify-content: space-between;
      gap: 30px; padding: 13px 16px; min-height: 47px;
      background: var(--accent); border: 0; border-radius: 4px;
      color: #23130f; font-weight: 700;
    }
    #launch:hover { background: #ffc2a5; }
    #launch .arrow { font-size: 19px; }
    #loadModel {
      display: block; margin: 10px 0 0; padding: 9px 13px;
      background: #10101bcc; border: 1px solid #ffa57b70; border-radius: 4px; color: var(--accent);
    }
    #loadModel:hover { border-color: var(--accent); }
    .controls, .metrics { display: flex; align-items: center; gap: clamp(12px, 2vw, 30px); }
    .control { display: flex; align-items: center; gap: 7px; color: var(--muted); }
    kbd {
      display: inline-grid; place-items: center; min-height: 21px; padding: 0 5px;
      color: var(--ink); font: 10px var(--mono); background: #151520;
      border: 1px solid var(--line); border-radius: 3px;
    }
    .metrics > div { min-width: 65px; }
    .metrics output { display: block; font: 17px/1.5 var(--mono); white-space: nowrap; }
    .radar {
      position: absolute; right: var(--pad); bottom: 91px; width: 168px;
      padding: 11px 12px 8px; background: #0d101cc4;
      border: 1px solid var(--line); border-radius: 5px; pointer-events: none;
    }
    .radar-title { display: flex; justify-content: space-between; }
    .radar-title span { color: var(--muted); }
    #radar { display: block; width: 100%; height: auto; }
    .legend { display: flex; justify-content: center; gap: 12px; font: 9px var(--mono); }
    .legend i { display: inline-block; width: 5px; height: 5px; margin-right: 4px; }
    .rock-key { background: var(--accent); }
    .comet-key { background: #a4ecff; }
    #aim {
      position: absolute; left: 50%; top: 50%; width: 34px; height: 34px;
      transform: translate(-50%, -50%); border: 1px solid #e7ecff6b;
      border-radius: 50%; pointer-events: none;
    }
    #aim::before, #aim::after { content: ""; position: absolute; background: #fff9; inset: 15px 10px; }
    #aim::after { inset: 10px 15px; }
    .tag {
      position: absolute; transform: translateY(-50%); display: flex; align-items: center;
      gap: 7px; white-space: nowrap; pointer-events: none; color: #ffc4a9;
      text-shadow: 0 1px 7px #080912, 0 1px 7px #080912;
    }
    .tag::before { content: ""; width: 19px; height: 1px; background: currentColor; }
    #cometTag { color: #b5efff; }
    #error { max-width: 360px; color: #ffc4a9; }
    @media (max-width: 780px) { .secondary-control { display: none; } .radar { width: 130px; } }
    @media (max-width: 590px), (max-height: 520px) {
      .radar, .tag, .status { display: none; }
      .briefing { bottom: 100px; } .briefing p { font-size: 14px; }
      .metrics .distance { display: none; } footer { gap: 8px; }
      .control { gap: 4px; } .mono { letter-spacing: .07em; }
    }
  </style>
</head>
<body>
  <canvas id="space" tabindex="-1" aria-label="Third-person 3D view of a spacecraft in an asteroid belt"></canvas>
  <div class="shade" aria-hidden="true"></div>

<header>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <div><strong>KEPLER</strong><small class="mono">Flight console</small></div>
    </div>
    <div class="status mono" id="status" role="status">Standby</div>
    <button class="mono" id="reset" type="button" title="Reset position (R)">↻ <span>Reset position</span></button>
  </header>

<main class="briefing" id="briefing">
    <div class="sector mono">Sector 07 / Asteroid belt</div>
    <h1>Ceres Drift</h1>
    <p>Third-person free flight through a moving asteroid field.</p>
    <button id="launch" type="button"><span id="launchText">Begin flight</span><span class="arrow" aria-hidden="true">↗</span></button>
    <button id="loadModel" type="button" hidden>⇪ Load your spacecraft.glb</button>
    <input id="glbFile" type="file" accept=".glb" hidden>
    <p id="error" role="alert" hidden></p>
  </main>

<div id="aim" aria-hidden="true" hidden></div>
  <div class="tag mono" id="rockTag" aria-hidden="true" hidden>Asteroid A-01</div>
  <div class="tag mono" id="cometTag" aria-hidden="true" hidden>Comet C-01</div>

<aside class="radar" aria-label="Proximity radar">
    <div class="radar-title mono">Radar <span>180 u</span></div>
    <canvas id="radar" width="260" height="260" aria-label="Nearby objects"></canvas>
    <div class="legend">
      <span><i class="rock-key"></i>Asteroid</span>
      <span><i class="comet-key"></i>Comet</span>
    </div>
  </aside>

<footer>
    <div class="controls mono" aria-label="Flight controls">
      <span class="control"><kbd>WASD</kbd> Fly</span>
      <span class="control"><kbd id="lookKey">Mouse</kbd> Look</span>
      <span class="control secondary-control"><kbd>Q / E</kbd> Descend / ascend</span>
      <span class="control secondary-control"><kbd>Shift</kbd> Boost</span>
      <span class="control secondary-control"><kbd>Esc</kbd> Release</span>
    </div>
    <div class="metrics">
      <div><small class="mono">Speed</small><output id="speed">0 u/s</output></div>
      <div><small class="mono">Heading</small><output id="heading">000°</output></div>
      <div class="distance"><small class="mono">From start</small><output id="distance">0 u</output></div>
    </div>
  </footer>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

/* ================= tunables ================= */
    const SHIP_MODEL_URL = 'spacecraft.glb';  // auto-loaded when next to this HTML on http(s)
    const SHIP_LENGTH = 7;                    // normalized longest axis of the ship, world units
    const SHIP_FIX_DEG = [0, 0, 0];           // extra X/Y/Z degrees if the model faces the wrong way
    const CHASE_BACK = 13, CHASE_UP = 2.8;     // third-person camera offset behind/above the ship
    const FLY_SPEED = 23, BOOST_SPEED = 57;

/* ================= helpers (defined BEFORE use) ================= */
    const byId = id => document.getElementById(id);
    const canvas = byId('space');
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const wrap = (v, span) => v - span * Math.floor(v / span + 0.5);
    const rnd = (lo, hi) => lo + Math.random() * (hi - lo);

/* ================= state ================= */
    let renderer, scene, camera, radar;
    let ship = null, fallbackShip = null, mixer = null;
    const position = new THREE.Vector3(), velocity = new THREE.Vector3();
    const desired = new THREE.Vector3(), forward = new THREE.Vector3(), right = new THREE.Vector3();
    const camPos = new THREE.Vector3(), camAim = new THREE.Vector3(), tmpV = new THREE.Vector3();
    const offset = new THREE.Vector3(), headOff = new THREE.Vector3();
    const keys = new Set();
    const flightKeys = new Set(['KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE','ShiftLeft','ShiftRight','KeyR']);
    const rocks = [], comets = [];
    const asteroidGeos = [];
    let yaw = 0, pitch = 0, roll = 0;
    let time = 0, previousTime = 0, previousHud = -1, lastMixerTime = 0;
    let flying = false, hadLock = false, drag = null;

/* ================= boot ================= */
    function startGame() {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070810);
      camera = new THREE.PerspectiveCamera(62, 1, 0.1, 9000);

ship = new THREE.Group();
      ship.rotation.order = 'YXZ';
      scene.add(ship);

radar = byId('radar').getContext('2d');
      buildLights(); buildSky(); buildPlanet(); buildRocks(); buildComets();
      buildFallbackShip(); bindShipLoading(); bindInput();
      resize();
      window.addEventListener('resize', resize);
      requestAnimationFrame(frame);
    }

function resize() {
      const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

/* ================= environment ================= */
    function buildLights() {
      const sun = new THREE.DirectionalLight(0xfff0dd, 2.6);
      sun.position.set(-7.2, 7.8, 4.2);
      scene.add(sun);
      scene.add(new THREE.AmbientLight(0x39405f, 1.6));
      const fill = new THREE.DirectionalLight(0x9fb4ff, 0.5);
      fill.position.set(7, -5, 4);
      scene.add(fill);
    }

function buildSky() {
      const c = document.createElement('canvas');
      c.width = c.height = 1024;
      const x = c.getContext('2d');
      x.fillStyle = '#070810';
      x.fillRect(0, 0, 1024, 1024);
      x.globalCompositeOperation = 'lighter';
      const blotch = (cx, cy, r, color) => {
        const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, color);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        x.fillStyle = g;
        x.fillRect(cx - r, cy - r, r * 2, r * 2);
      };
      blotch(300, 420, 320, 'rgba(40,60,140,0.32)');
      blotch(700, 300, 260, 'rgba(120,45,60,0.24)');
      blotch(560, 650, 340, 'rgba(30,45,110,0.26)');
      blotch(150, 720, 220, 'rgba(95,40,50,0.18)');
      blotch(880, 640, 210, 'rgba(40,80,150,0.20)');
      const nebula = new THREE.CanvasTexture(c);
      nebula.colorSpace = THREE.SRGBColorSpace;
      scene.add(new THREE.Mesh(
        new THREE.SphereGeometry(3600, 32, 24),
        new THREE.MeshBasicMaterial({ map: nebula, side: THREE.BackSide, depthWrite: false, fog: false })
      ));

const N = 5200;
      const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
      const v = new THREE.Vector3();
      for (let i = 0; i < N; i++) {
        v.randomDirection().multiplyScalar(rnd(2500, 3300));
        pos.set([v.x, v.y, v.z], i * 3);
        const t = Math.random(), b = 0.25 + Math.random() * 0.75;
        col.set([(0.66 + t * 0.34) * b, (0.79 + t * 0.07) * b, (1 - t * 0.14) * b], i * 3);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
        size: 2, sizeAttenuation: false, vertexColors: true,
        transparent: true, depthWrite: false, fog: false
      })));
    }

function buildPlanet() {
      const pivot = new THREE.Group();
      pivot.position.set(-640, 480, -2100);
      pivot.add(new THREE.Mesh(
        new THREE.SphereGeometry(360, 48, 32),
        new THREE.MeshStandardMaterial({
          color: 0xc07042, roughness: 0.85, metalness: 0.05,
          emissive: 0x1c0d07, emissiveIntensity: 0.6
        })
      ));
      const ringGeo = new THREE.RingGeometry(430, 660, 128);
      const rp = ringGeo.attributes.position;
      const colors = new Float32Array(rp.count * 3);
      for (let i = 0; i < rp.count; i++) {
        const r = Math.hypot(rp.getX(i), rp.getY(i));
        const t = clamp((r - 430) / 230, 0, 1);
        const gap = r > 500 && r < 555 ? 0.15 : 1;
        const b = (0.45 + 0.3 * Math.sin(r * 0.9)) * gap * (1 - t * 0.3);
        colors.set([b, b * 0.78, b * 0.6], i * 3);
      }
      ringGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
        vertexColors: true, side: THREE.DoubleSide, transparent: true,
        opacity: 0.85, depthWrite: false, fog: false
      }));
      ring.rotation.x = Math.PI / 2 - 0.32;
      pivot.add(ring);
      scene.add(pivot);
    }

function makeAsteroidGeometry(phase) {
      const geo = new THREE.IcosahedronGeometry(1, 3);
      const pos = geo.attributes.position;
      const v = new THREE.Vector3(), crater = new THREE.Vector3(0.48, 0.44, 0.76);
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const craterDot = v.dot(crater);
        const dent = 0.22 * Math.exp(-(((1 - craterDot) * 23) ** 2));
        const r = 1 - dent + 0.17 * Math.sin(v.x * 4 + v.y * 3 - v.z * 2 + phase)
                     + 0.085 * Math.sin(v.y * 9 + v.z * 6 - v.x * 5);
        v.multiplyScalar(r);
        pos.setXYZ(i, v.x * 1.14, v.y * 0.83, v.z);
      }
      geo.computeVertexNormals();
      return geo;
    }

function buildRocks() {
      for (const phase of [0.8, 2.4, 5.6]) asteroidGeos.push(makeAsteroidGeometry(phase));
      const fixed = [
        [[47, 11, -104], 18], [[-63, 30, -127], 6], [[22, -25, -65], 4.3],
        [[84, -34, -122], 11], [[-83, -37, -150], 9]
      ];
      const warm = new THREE.Color();
      for (let i = 0; i < 60; i++) {
        const origin = new THREE.Vector3();
        let radius;
        if (i < 5) { origin.fromArray(fixed[i][0]); radius = fixed[i][1]; }
        else {
          origin.set(rnd(-255, 255), rnd(-180, 180), rnd(-255, 255));
          if (origin.length() < 42) origin.multiplyScalar(1.6);
          radius = 1.2 + Math.random() ** 2 * 8;
        }
        const mesh = new THREE.Mesh(asteroidGeos[Math.floor(Math.random() * asteroidGeos.length)],
          new THREE.MeshStandardMaterial({
            color: warm.setHSL(0.07 + Math.random() * 0.05, 0.18, 0.38 + Math.random() * 0.12),
            roughness: 0.95, metalness: 0.05
          }));
        mesh.scale.setScalar(radius);
        scene.add(mesh);
        rocks.push({
          mesh, radius, origin,
          drift: new THREE.Vector3(rnd(-3, 3), rnd(-1.2, 1.2), rnd(-2, 2)),
          spin: rnd(-0.27, 0.27), phase: rnd(0, 6.28),
          relative: new THREE.Vector3()
        });
      }
    }

function buildComets() {
      const specs = [
        { origin: [74, 46, -165], curve: [0, -81, -84], direction: [-125, -48, 25], rate: 0.065 },
        { origin: [-67, -27, -150], curve: [90, 44, -90], direction: [128, 25, 26], rate: 0.051 }
      ];
      for (const s of specs) {
        const head = new THREE.Mesh(
          new THREE.SphereGeometry(3, 12, 10),
          new THREE.MeshBasicMaterial({ color: 0xbdeeff, fog: false })
        );
        const N = 176;
        const pos = new Float32Array(N * 3);
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const tail = new THREE.Points(geo, new THREE.PointsMaterial({
          color: 0x6bd2ff, size: 1.6, transparent: true, opacity: 0.55,
          blending: THREE.AdditiveBlending, depthWrite: false, fog: false
        }));
        scene.add(head, tail);
        comets.push({
          head, tail, N, pos,
          origin: new THREE.Vector3().fromArray(s.origin),
          curve: new THREE.Vector3().fromArray(s.curve),
          direction: new THREE.Vector3().fromArray(s.direction),
          rate: s.rate, relative: new THREE.Vector3(), headWorld: new THREE.Vector3()
        });
      }
    }

function cometOffset(body, out, t) {
      const a = t * body.rate;
      out.set(
        body.curve.x * (Math.cos(a) - 1) + body.direction.x * Math.sin(a),
        body.curve.y * (Math.cos(a) - 1) + body.direction.y * Math.sin(a),
        body.curve.z * (Math.cos(a) - 1) + body.direction.z * Math.sin(a)
      );
      return out;
    }

/* ================= ship models ================= */
    function buildFallbackShip() {
      const g = new THREE.Group();
      const hull = new THREE.Mesh(
        new THREE.ConeGeometry(1.15, 5, 8),
        new THREE.MeshStandardMaterial({ color: 0xd9d9e6, metalness: 0.75, roughness: 0.32 })
      );
      hull.rotation.x = -Math.PI / 2;
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.85, 1.15, 2.6, 8),
        new THREE.MeshStandardMaterial({ color: 0x8a8fa8, metalness: 0.8, roughness: 0.35 })
      );
      body.rotation.x = Math.PI / 2; body.position.z = 2.4;
      const wingGeo = new THREE.BoxGeometry(4.6, 0.14, 1.4);
      const wMat = new THREE.MeshStandardMaterial({ color: 0x5a5f78, metalness: 0.7, roughness: 0.4 });
      const left = new THREE.Mesh(wingGeo, wMat); left.position.set(-1.6, 0, 1.6);
      const right = new THREE.Mesh(wingGeo, wMat); right.position.set(1.6, 0, 1.6);
      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(0.6, 12, 10),
        new THREE.MeshBasicMaterial({ color: 0x6bd2ff, fog: false })
      );
      glow.position.set(0, 0, 3.9);
      g.add(hull, body, left, right, glow);
      fallbackShip = g;
      ship.add(g);
    }

function makeLoader() {
      const draco = new DRACOLoader();
      draco.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
      const loader = new GLTFLoader();
      loader.setDRACOLoader(draco);
      return loader;
    }

function showError(err) {
      console.error(err);
      const el = byId('error');
      el.textContent = 'Could not read spacecraft.glb — showing the placeholder ship. ' +
        'Use the Load button or drag-drop the .glb onto this page.';
      el.hidden = false;
      setTimeout(() => { el.hidden = true; }, 9000);
    }

function installShip(gltf) {
      const model = gltf.scene || (gltf.scenes && gltf.scenes[0]);
      if (!model) return showError('GLB has no scene');

if (gltf.animations && gltf.animations.length) {
        mixer = new THREE.AnimationMixer(model);
        mixer.clipAction(gltf.animations[0]).play();
      }

model.traverse(o => {
        if (o.isMesh && o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          for (const m of mats) {
            if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
            if (m.side === THREE.DoubleSide) m.side = THREE.FrontSide;
          }
        }
      });

// auto-fit: center + normalize longest axis to SHIP_LENGTH
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      model.position.sub(box.getCenter(new THREE.Vector3()));
      model.scale.multiplyScalar(SHIP_LENGTH / Math.max(size.x, size.y, size.z, 1e-4));

// auto-orient: longest axis becomes forward (-z)
      const orient = new THREE.Group();
      orient.add(model);
      if (size.x >= size.y && size.x >= size.z) orient.rotation.y = Math.PI / 2;
      else if (size.y > size.z) orient.rotation.x = -Math.PI / 2;

const fix = new THREE.Group();
      fix.add(orient);
      fix.rotation.set(
        THREE.MathUtils.degToRad(SHIP_FIX_DEG[0]),
        THREE.MathUtils.degToRad(SHIP_FIX_DEG[1]),
        THREE.MathUtils.degToRad(SHIP_FIX_DEG[2])
      );

if (fallbackShip) { ship.remove(fallbackShip); fallbackShip = null; }
      ship.clear();
      ship.add(fix);
      flashStatus('Ship loaded');
    }

function flashStatus(text) {
      const s = byId('status');
      s.textContent = text;
      setTimeout(() => {
        if (s.textContent === text) s.textContent = flying ? 'Flight active' : 'Standby';
      }, 2500);
    }

function bindShipLoading() {
      const fileInput = byId('glbFile');
      const loadBtn = byId('loadModel');
      loadBtn.hidden = false;
      loadBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', () => {
        const f = fileInput.files && fileInput.files[0];
        if (f) f.arrayBuffer().then(buf => makeLoader().parse(buf, '', installShip, showError)).catch(showError);
      });
      window.addEventListener('dragover', e => e.preventDefault());
      window.addEventListener('drop', e => {
        e.preventDefault();
        const f = [...(e.dataTransfer?.files || [])].find(f => /\.glb$/i.test(f.name));
        if (f) f.arrayBuffer().then(buf => makeLoader().parse(buf, '', installShip, showError)).catch(showError);
      });
      if (location.protocol === 'http:' || location.protocol === 'https:') {
        fetch(SHIP_MODEL_URL).then(r => {
          if (!r.ok) throw 0;
          return r.arrayBuffer();
        }).then(buf => makeLoader().parse(buf, '', installShip, showError))
          .catch(() => { /* no model next to the HTML; button/drag-drop still work */ });
      }
    }

/* ================= input ================= */
    function resetPosition() {
      position.set(0, 0, 0); velocity.set(0, 0, 0);
      yaw = 0; pitch = 0; roll = 0;
    }

function look(dx, dy) {
      yaw = (yaw + dx * 0.0023) % (Math.PI * 2);
      pitch = clamp(pitch - dy * 0.0023, -1.565, 1.565);
    }

function setFlight(active) {
      flying = active;
      const locked = document.pointerLockElement === canvas;
      byId('briefing').hidden = active;
      byId('aim').hidden = !active;
      byId('status').textContent = active ? 'Flight active' : 'Standby';
      byId('lookKey').textContent = active && !locked ? 'Drag' : 'Mouse';
      canvas.classList.toggle('drag-mode', active && !locked);
      if (active) byId('launchText').textContent = 'Resume flight';
      else {
        keys.clear(); velocity.set(0, 0, 0); drag = null;
        canvas.classList.remove('dragging');
      }
    }

function bindInput() {
      byId('launch').addEventListener('click', async () => {
        setFlight(true);
        canvas.focus({ preventScroll: true });
        if (canvas.requestPointerLock) {
          try { await canvas.requestPointerLock(); } catch { /* drag mode is fine */ }
        }
      });
      byId('reset').addEventListener('click', resetPosition);

document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === canvas) {
          hadLock = true; setFlight(true);
        } else if (hadLock) {
          hadLock = false; setFlight(false);
          byId('launch').focus({ preventScroll: true });
        }
      });

document.addEventListener('mousemove', e => {
        if (document.pointerLockElement === canvas) look(e.movementX, e.movementY);
      });

canvas.addEventListener('pointerdown', e => {
        if (!flying || document.pointerLockElement === canvas || e.button !== 0) return;
        drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
        try { canvas.setPointerCapture(e.pointerId); } catch {}
        canvas.classList.add('dragging');
      });
      canvas.addEventListener('pointermove', e => {
        if (!drag || e.pointerId !== drag.id) return;
        look(e.clientX - drag.x, e.clientY - drag.y);
        drag.x = e.clientX; drag.y = e.clientY;
      });
      canvas.addEventListener('lostpointercapture', () => {
        drag = null; canvas.classList.remove('dragging');
      });

window.addEventListener('keydown', e => {
        if (!flying) return;
        if (e.code === 'Escape') {
          if (document.pointerLockElement === canvas) document.exitPointerLock();
          else { setFlight(false); byId('launch').focus({ preventScroll: true }); }
          return;
        }
        if (!flightKeys.has(e.code)) return;
        e.preventDefault();
        if (e.code === 'KeyR' && !e.repeat) resetPosition();
        keys.add(e.code);
      });
      window.addEventListener('keyup', e => keys.delete(e.code));
      window.addEventListener('blur', () => { keys.clear(); velocity.set(0, 0, 0); });
    }

/* ================= flight + chase camera ================= */
    function updatePlayer(dt) {
      forward.set(
        -Math.sin(yaw) * Math.cos(pitch),
        Math.sin(pitch),
        -Math.cos(yaw) * Math.cos(pitch)
      );
      right.set(Math.cos(yaw), 0, -Math.sin(yaw));

if (flying) {
        const fwd = Number(keys.has('KeyW')) - Number(keys.has('KeyS'));
        const side = Number(keys.has('KeyD')) - Number(keys.has('KeyA'));
        const vert = Number(keys.has('KeyE')) - Number(keys.has('KeyQ'));
        desired.set(0, 0, 0).addScaledVector(forward, fwd).addScaledVector(right, side);
        desired.y += vert;
        const boost = keys.has('ShiftLeft') || keys.has('ShiftRight');
        if (desired.lengthSq() > 1e-6) desired.normalize().multiplyScalar(boost ? BOOST_SPEED : FLY_SPEED);
        else desired.set(0, 0, 0);
        velocity.lerp(desired, 1 - Math.exp(-7 * dt));
        position.addScaledVector(velocity, dt);
        const targetRoll = -side * 0.55; // banking
        roll += (targetRoll - roll) * (1 - Math.exp(-5 * dt));
      }

ship.position.copy(position);
      ship.rotation.set(pitch, yaw, roll); // YXZ order

// third-person chase camera
      camPos.copy(position).addScaledVector(forward, -CHASE_BACK);
      camPos.y += CHASE_UP;
      camera.position.lerp(camPos, flying ? 1 - Math.exp(-9 * dt) : 1);
      camAim.copy(position).addScaledVector(forward, 8);
      camAim.y += 1.2;
      camera.lookAt(camAim);
    }

/* ================= world update ================= */
    function updateWorld() {
      if (mixer) mixer.update(Math.min(time - lastMixerTime, 0.05));
      lastMixerTime = time;

for (const rock of rocks) {
        offset.copy(rock.origin).addScaledVector(rock.drift, time).sub(position);
        offset.set(wrap(offset.x, 520), wrap(offset.y, 520), wrap(offset.z, 520));
        rock.mesh.position.copy(offset);
        rock.relative.copy(offset);
        rock.mesh.rotation.set(rock.phase + time * rock.spin, time * 0.13 + rock.phase * 0.4, 0);
      }

for (const body of comets) {
        cometOffset(body, headOff, time);
        body.headWorld.copy(body.origin).add(headOff).sub(position);
        body.head.position.copy(body.headWorld);
        body.relative.copy(body.headWorld);

const p = body.pos;
        for (let i = 0; i < body.N; i++) {
          const age = (i + 0.5) / body.N;
          cometOffset(body, offset, time - age * 12);
          const spread = 0.24 + age * 5.2;
          const curl = Math.sin(time * 1.38 - age * 12) * age * 1.8;
          offset.sub(headOff);
          p[i * 3]     = body.headWorld.x + offset.x + Math.sin(i * 2.399) * spread * 0.18;
          p[i * 3 + 1] = body.headWorld.y + offset.y + curl + Math.cos(i * 1.7 + 1.1) * spread * 0.18;
          p[i * 3 + 2] = body.headWorld.z + offset.z + Math.sin(i * 0.9 + 2.0) * spread * 0.18;
        }
        body.tail.geometry.attributes.position.needsUpdate = true;
      }
    }

/* ================= HUD ================= */
    function updateTag(id, body) {
      const label = byId(id);
      const dist = body.relative.length();
      if (dist > 260 || dist < 6) { label.hidden = true; return; }
      tmpV.copy(body.relative).project(camera);
      if (tmpV.z > 1) { label.hidden = true; return; }
      const w = canvas.clientWidth, h = canvas.clientHeight;
      const x = (tmpV.x + 1) / 2 * w;
      const y = (1 - tmpV.y) / 2 * h;
      if (x < w * 0.44 || x > w - 132 || y < 96 || y > h * 0.72) { label.hidden = true; return; }
      label.hidden = false;
      label.style.left = `${x + 10}px`;
      label.style.top = `${y}px`;
    }

function drawRadar() {
      if (!radar) return;
      const center = 130, radius = 110;
      radar.clearRect(0, 0, 260, 260);
      radar.strokeStyle = '#dce4ff39';
      radar.lineWidth = 1;
      for (const ring of [radius / 3, radius * 2 / 3, radius]) {
        radar.beginPath(); radar.arc(center, center, ring, 0, Math.PI * 2); radar.stroke();
      }
      radar.beginPath();
      radar.moveTo(center - radius, center); radar.lineTo(center + radius, center);
      radar.moveTo(center, center - radius); radar.lineTo(center, center + radius);
      radar.stroke();

const sweep = time * 0.9;
      radar.beginPath(); radar.moveTo(center, center);
      radar.arc(center, center, radius, sweep - 0.34, sweep);
      radar.closePath(); radar.fillStyle = '#9ee8ff12'; radar.fill();

const drawContact = (body, color, size) => {
        const r = body.relative;
        if (r.length() > 180) return;
        const horizontal = r.x * Math.cos(yaw) + r.z * Math.sin(yaw);
        const ahead = r.x * Math.sin(yaw) - r.z * Math.cos(yaw);
        radar.globalAlpha = clamp(1 - Math.abs(r.y) / 200, 0.25, 1);
        radar.fillStyle = color;
        radar.beginPath();
        radar.arc(center + horizontal * radius / 180, center - ahead * radius / 180, size, 0, Math.PI * 2);
        radar.fill();
        radar.globalAlpha = 1;
      };
      for (const body of rocks) drawContact(body, '#ffa57b', body.radius > 9 ? 4 : 2.7);
      for (const body of comets) drawContact(body, '#a4ecff', 5);

radar.fillStyle = '#f2ede8';
      radar.beginPath();
      radar.moveTo(center, center - 7); radar.lineTo(center + 5, center + 5);
      radar.lineTo(center, center + 2); radar.lineTo(center - 5, center + 5);
      radar.closePath(); radar.fill();
    }

function updateHud() {
      const degrees = ((Math.round(yaw * 180 / Math.PI) % 360) + 360) % 360;
      byId('heading').textContent = `${String(degrees).padStart(3, '0')}°`;
      byId('speed').textContent = `${Math.round(velocity.length())} u/s`;
      byId('distance').textContent = `${Math.round(position.length())} u`;
      drawRadar();
    }

/* ================= main loop ================= */
    function frame(now) {
      const dt = previousTime ? Math.min((now - previousTime) / 1000, 0.05) : 0;
      previousTime = now;
      time += dt;
      updatePlayer(dt);
      updateWorld();
      renderer.render(scene, camera);
      updateTag('rockTag', rocks[0]);
      updateTag('cometTag', comets[0]);
      if (time - previousHud >= 0.075) { previousHud = time; updateHud(); }
      requestAnimationFrame(frame);
    }

/* ================= GO (called last — everything above is initialized) ================= */
    try { startGame(); } catch (problem) {
      console.error(problem);
      const el = byId('error');
      el.textContent = 'The 3D view could not start. Try a desktop browser with WebGL enabled (needs internet for three.js CDN).';
      el.hidden = false;
      byId('launch').disabled = true;
      byId('reset').disabled = true;
    }
  </script>
</body>
</html>
